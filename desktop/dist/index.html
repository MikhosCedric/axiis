<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axiis</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; opacity: .75; }
      a { display: inline-block; padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid currentColor; color: inherit; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Axiis can&rsquo;t connect</h1>
      <p>Check your internet connection. Your items are safe on the server and will be here when you are back online. Anything you captured while offline is kept on this device and is sent once Axiis opens with a connection.</p>
      <a id="retry" href="https://axiis-lovat.vercel.app/today">Try again</a>
      <p id="status" role="status" style="margin-top:1rem;font-size:.9rem"></p>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
