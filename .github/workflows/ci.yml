name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; a job that needs more grants it on its own.
# Actions are pinned by commit SHA, with the release in a comment for Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # What ships to users: a high or critical advisory in a runtime dependency fails the build. Dev-only tooling is left to Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      # The browser-test fake session must not exist in the production build just made, and serving that build
      # with the session switched on at runtime must still sign nobody in (docs/e2e-session.md).
      - run: npm run check:no-fake-session -- --skip-build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      # Tests run in the runner's installed Google Chrome, so Playwright's own browsers are not needed.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Builds the browser-test production bundle (AXIIS_E2E_BUILD=1, into .next-e2e) and tests it under next start.
      - run: npm run e2e
        env:
          CI: "true"
      # The check job's marker search finds every marker in this build, so it would catch the fake session leaking.
      - run: npm run check:no-fake-session -- --control .next-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
