name: desktop-release

# Pushing a tag like desktop-v0.1.1 builds the Windows installer, signs the update with the minisign key in the
# TAURI_SIGNING_PRIVATE_KEY secret, and publishes both with latest.json, which installed apps read to update themselves.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp the version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version='$version';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          sed -i "0,/^version = .*/s//version = \"$version\"/" src-tauri/Cargo.toml
      - run: npx tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          dir=src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe)
          name=$(basename "$exe")
          node -e "
            const fs=require('fs');
            const sig=fs.readFileSync('$exe.sig','utf8').trim();
            const url='https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/'+encodeURIComponent('$name');
            fs.writeFileSync('latest.json',JSON.stringify({version:'$version',notes:'Axiis desktop $version',pub_date:new Date().toISOString(),platforms:{'windows-x86_64':{signature:sig,url}}},null,2));
          "
          gh release create "$GITHUB_REF_NAME" "$exe" "$exe.sig" latest.json --title "Axiis desktop $version" --notes "Installed apps update themselves from this release."
