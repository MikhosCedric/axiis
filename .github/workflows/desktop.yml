name: desktop

# The Tauri shell builds on Windows when the shell changes. It is separate from `ci` so web-only changes pay nothing.
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "desktop/**", ".github/workflows/desktop.yml", "package-lock.json"]
  pull_request:
    paths: ["src-tauri/**", "desktop/**", ".github/workflows/desktop.yml", "package-lock.json"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rust and the MSVC tools come with the runner image. No cache action: every action here is pinned by SHA, and a
      # shell build only runs when the shell changes.
      # An unsigned installer: signing needs a certificate we have chosen not to buy yet.
      - run: npx tauri build --ci
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiis-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
